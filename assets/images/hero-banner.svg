<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Brand Icon Box -->
  <g transform="translate(140, 130)">
    <rect width="90" height="90" rx="20" fill="url(#accent)" filter="url(#shadow)" />
    <!-- Layers Icon -->
    <path d="M45 22 L72 36 L45 50 L18 36 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
    <path d="M18 48 L45 62 L72 48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
    <path d="M18 60 L45 74 L72 60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="260" y="185" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Iterative To-Do List</text>
  <text x="260" y="225" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500">Modern, Complete-Based Recurring Task Management for High Productivity</text>

  <!-- Feature Pills -->
  <g transform="translate(260, 255)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1.5" />
    <text x="85" y="22" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Complete-Based Recurrence</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="145" height="34" rx="17" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5" />
    <text x="257" y="22" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">📋 Kanban & Calendar</text>

    <!-- Pill 3 -->
    <rect x="345" y="0" width="135" height="34" rx="17" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="412" y="22" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Chart.js Analytics</text>

    <!-- Pill 4 -->
    <rect x="495" y="0" width="150" height="34" rx="17" fill="rgba(139, 92, 246, 0.2)" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="570" y="22" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">💾 100% LocalStorage</text>
  </g>
</svg>

